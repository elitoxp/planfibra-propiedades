<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publicar propiedad | CasaRey</title><meta name="description" content="Prepara tu aviso para publicar una propiedad en CasaRey.">
<link rel="canonical" href="https://propiedades.planfibra.cl/publicar/"><link rel="stylesheet" href="/assets/site.css?v=1"></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="/"><span class="mark">⌂</span><span>CasaRey<small>Propiedades</small></span></a><a class="publish" href="/">Volver</a></div></header>
<main><section class="section"><div class="wrap" style="max-width:820px"><span class="eyebrow">Publica con nosotros</span><h1 style="font-size:clamp(46px,7vw,72px)">Prepara tu aviso.</h1><p class="lead">Completa los datos principales. En esta primera versión generamos una vista previa antes de activar la recepción de publicaciones reales.</p>
<div class="heroPanel"><div class="searchGrid"><label>Operación<select id="pOp"><option>Venta</option><option>Arriendo</option></select></label><label>Tipo<select id="pType"><option>Casa</option><option>Departamento</option><option>Parcela</option><option>Terreno</option><option>Comercial</option></select></label><label class="wide">Título<input id="pTitle" placeholder="Ej: Casa 3 dormitorios con patio"></label><label>Comuna<input id="pCommune" placeholder="Ej: Concepción"></label><label>Precio<input id="pPrice" placeholder="Ej: UF 4.500 o $550.000"></label><label>Superficie<input id="pArea" placeholder="Ej: 120 m²"></label><label>Dormitorios<input id="pBeds" inputmode="numeric"></label><label class="wide">Descripción<textarea id="pDesc" rows="6" placeholder="Describe la propiedad, sector, equipamiento y condiciones."></textarea></label><button class="primary wide" id="previewBtn">Crear vista previa</button></div></div>
<div id="previewBox" style="display:none;margin-top:18px" class="heroPanel"></div></div></section></main>
<script>document.querySelector('#previewBtn').onclick=()=>{const g=id=>document.querySelector(id).value||'—';const box=document.querySelector('#previewBox');box.style.display='block';box.innerHTML='<span class="eyebrow">Vista previa</span><h2>'+g('#pTitle')+'</h2><p>'+g('#pOp')+' · '+g('#pType')+' · '+g('#pCommune')+'</p><div class="price">'+g('#pPrice')+'</div><p>'+g('#pArea')+' · '+g('#pBeds')+' dormitorios</p><p>'+g('#pDesc')+'</p><p><b>Estado:</b> borrador local, aún no publicado.</p>';};</script></body></html>
